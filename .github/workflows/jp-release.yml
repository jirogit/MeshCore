name: Build JP Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'jp-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build JP Firmwares
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION || 'dev' }}

          PLATFORMIO_BUILD_FLAGS: >-
            -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
            -D LORA_FREQ=921.000
            -D LORA_BW=125.0
            -D LORA_SF=10
            -D LORA_CR=6
            -D 'ALLOWED_REPEAT_FREQ_RANGE={921200,921200}'
            -D ENABLE_ADVERT_ON_BOOT=1
            -D RSSI_LBT_DEFAULT_ON=1
            -D ENABLE_PRIVATE_KEY_IMPORT=1
            -D ENABLE_PRIVATE_KEY_EXPORT=1
            -D RADIOLIB_EXCLUDE_CC1101=1
            -D RADIOLIB_EXCLUDE_RF69=1
            -D RADIOLIB_EXCLUDE_SX1231=1
            -D RADIOLIB_EXCLUDE_SI443X=1
            -D RADIOLIB_EXCLUDE_RFM2X=1
            -D RADIOLIB_EXCLUDE_SX128X=1
            -D RADIOLIB_EXCLUDE_AFSK=1
            -D RADIOLIB_EXCLUDE_AX25=1
            -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
            -D RADIOLIB_EXCLUDE_MORSE=1
            -D RADIOLIB_EXCLUDE_APRS=1
            -D RADIOLIB_EXCLUDE_BELL=1
            -D RADIOLIB_EXCLUDE_RTTY=1
            -D RADIOLIB_EXCLUDE_SSTV=1

        run: |
          mkdir -p out_jp
          # JP TX power制限
          # Wio-SX1262搭載機（工事設計認証201-250230、証明出力10dBm）は10dBmに制限
          sed -i 's/-D LORA_TX_POWER=22/-D LORA_TX_POWER=10/g' \
            variants/xiao_nrf52/platformio.ini \
            variants/xiao_s3_wio/platformio.ini \
            variants/wio-tracker-l1/platformio.ini
          # T1000-E: Seeed確認済み証明上限19mW(≈12.79dBm)のため12dBmに制限
          sed -i 's/-D LORA_TX_POWER=22/-D LORA_TX_POWER=12/g' \
            variants/t1000-e/platformio.ini
          # それ以外はARIB STD-T108上限の13dBmのまま
          sed -i 's/-D LORA_TX_POWER=22/-D LORA_TX_POWER=13/g' \
            variants/rak_wismesh_tag/platformio.ini \
            variants/lilygo_techo_lite/platformio.ini \
            variants/heltec_t114/platformio.ini \
            variants/m5stack_unit_c6l/platformio.ini \
            variants/lilygo_tdeck/platformio.ini \
            variants/heltec_t1/platformio.ini \
            variants/meshtracker_x1/platformio.ini
          bash build.sh build-firmware RAK_WisMesh_Tag_companion_radio_ble
          bash build.sh build-firmware RAK_WisMesh_Tag_companion_radio_usb
          bash build.sh build-firmware RAK_WisMesh_Tag_repeater
          bash build.sh build-firmware RAK_WisMesh_Tag_room_server
          bash build.sh build-firmware t1000e_companion_radio_ble
          bash build.sh build-firmware t1000e_companion_radio_usb
          bash build.sh build-firmware t1000e_repeater 
          bash build.sh build-firmware t1000e_room_server
          bash build.sh build-firmware LilyGo_T-Echo-Lite_companion_radio_ble
          bash build.sh build-firmware LilyGo_T-Echo-Lite_repeater
          bash build.sh build-firmware LilyGo_T-Echo-Lite_room_server
          bash build.sh build-firmware Xiao_nrf52_companion_radio_ble
          bash build.sh build-firmware Xiao_nrf52_companion_radio_usb
          bash build.sh build-firmware Xiao_nrf52_repeater
          bash build.sh build-firmware Xiao_nrf52_room_server
          bash build.sh build-firmware Xiao_S3_WIO_companion_radio_ble
          bash build.sh build-firmware Xiao_S3_WIO_companion_radio_usb
          bash build.sh build-firmware Xiao_S3_WIO_repeater
          bash build.sh build-firmware Xiao_S3_WIO_room_server
          bash build.sh build-firmware Heltec_t114_without_display_companion_radio_ble
          bash build.sh build-firmware Heltec_t114_without_display_companion_radio_usb
          bash build.sh build-firmware Heltec_t114_without_display_repeater
          bash build.sh build-firmware Heltec_t114_without_display_room_server
          bash build.sh build-firmware Heltec_t114_companion_radio_ble
          bash build.sh build-firmware Heltec_t114_companion_radio_usb
          bash build.sh build-firmware Heltec_t114_repeater
          bash build.sh build-firmware Heltec_t114_room_server
          bash build.sh build-firmware WioTrackerL1_companion_radio_ble
          bash build.sh build-firmware WioTrackerL1_companion_radio_usb
          bash build.sh build-firmware WioTrackerL1_repeater
          bash build.sh build-firmware WioTrackerL1_room_server
          bash build.sh build-firmware M5Stack_Unit_C6L_companion_radio_ble
          bash build.sh build-firmware M5Stack_Unit_C6L_companion_radio_usb
          bash build.sh build-firmware M5Stack_Unit_C6L_repeater
          bash build.sh build-firmware M5Stack_Unit_C6L_room_server
          bash build.sh build-firmware LilyGo_TDeck_companion_radio_ble
          bash build.sh build-firmware LilyGo_TDeck_companion_radio_usb
          bash build.sh build-firmware LilyGo_TDeck_repeater
          bash build.sh build-firmware LilyGo_T-Echo-Lite_non_shell_companion_radio_usb
          bash build.sh build-firmware Heltec_t1_repeater
          bash build.sh build-firmware Heltec_t1_room_server
          bash build.sh build-firmware Heltec_t1_companion_radio_ble
          bash build.sh build-firmware Heltec_t1_companion_radio_usb
          bash build.sh build-firmware Heltec_t1_kiss_modem
          bash build.sh build-firmware RAK_WisMesh_Tag_kiss_modem
          bash build.sh build-firmware t1000e_kiss_modem
          bash build.sh build-firmware LilyGo_T-Echo-Lite_kiss_modem
          bash build.sh build-firmware Xiao_nrf52_kiss_modem
          bash build.sh build-firmware Xiao_S3_WIO_kiss_modem
          bash build.sh build-firmware Heltec_t114_kiss_modem
          bash build.sh build-firmware WioTrackerL1_kiss_modem
          bash build.sh build-firmware M5Stack_Unit_C6L_kiss_modem
          bash build.sh build-firmware LilyGo_TDeck_kiss_modem
          bash build.sh build-firmware Xiao_S3_WIO_companion_radio_wifi
          bash build.sh build-firmware M5Stack_Unit_C6L_companion_radio_wifi
          bash build.sh build-firmware MeshTracker_X1_companion_radio_ble
          bash build.sh build-firmware MeshTracker_X1_companion_radio_usb
          bash build.sh build-firmware MeshTracker_X1_repeater
          bash build.sh build-firmware MeshTracker_X1_room_server

      - name: Copy artifacts to out/
        run: |
          ls -la .pio/build/*/firmware.uf2 2>/dev/null || echo "no uf2 found"
          mkdir -p out_jp
          HASH=$(git rev-parse --short HEAD)
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "dev")
          # ビルドされた env をすべて拾う（機種の追加時にここを直す必要はない）
          for DIR in .pio/build/*/; do
            ENV=$(basename "$DIR")
            NAME="${ENV}-${TAG}-${HASH}"
            cp "${DIR}firmware.uf2" "out_jp/${NAME}.uf2" 2>/dev/null || true
            cp "${DIR}firmware.zip" "out_jp/${NAME}_dfu.zip" 2>/dev/null || true
            if [ -f "${DIR}firmware-merged.bin" ]; then
              cp "${DIR}firmware.bin" "out_jp/${NAME}.bin" 2>/dev/null || true
              cp "${DIR}firmware-merged.bin" "out_jp/${NAME}-merged.bin"
            fi
          done
          ls -la out_jp/

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: jp-firmwares
          path: out_jp

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: JP Firmware ${{ env.GIT_TAG_VERSION }}
          generate_release_notes: true
          body: |
            ## 日本向け MeshCore ファームウェア

            ### 対応デバイス
            | デバイス | ファイル | 書き込み方法 |
            |---|---|---|
            | WisMesh Tag | `RAK_WisMesh_Tag_companion_radio_ble-*.uf2` | UF2ドラッグ&ドロップ |
            | T1000-E | `t1000e_companion_radio_ble-*.uf2` | UF2ドラッグ&ドロップ |
            | T-Echo Lite | `LilyGo_T-Echo-Lite_companion_radio_ble-*.uf2` | UF2ドラッグ&ドロップ |
            | XIAO nRF52840 | `Xiao_nrf52_companion_radio_ble-*.uf2` | UF2ドラッグ&ドロップ |
            | Heltec T114 (ディスプレイなし) | `Heltec_t114_without_display_companion_radio_ble-*.uf2` | UF2ドラッグ&ドロップ |
            | Heltec T114 (ディスプレイあり) | `Heltec_t114_companion_radio_ble-*.uf2` | UF2ドラッグ&ドロップ |
            | Wio Tracker L1 Pro | `WioTrackerL1_companion_radio_ble-*.uf2` | UF2ドラッグ&ドロップ |
            | M5Stack Unit C6L | `M5Stack_Unit_C6L_companion_radio_ble-*-merged.bin` | esptool書き込み |
            | T-DECK | `LilyGo_TDeck_companion_radio_ble-*-merged.bin` | esptool書き込み |

            > ⚠️ Wio Tracker L1 Pro / T-DECK はCIビルド確認のみです。動作報告歓迎します。M5Stack Unit C6Lは起動時クラッシュループの原因を特定・修正しました（実機はflash_mode=QIO非対応、配布バイナリのヘッダをDIOに変更）。実機での動作を確認済みです。

            以上の表に載っていないデバイスや、リピーター、ルームサーバーもリリースしていますが、実験的です。

            ### 日本での運用設定
            フラッシュ後、スマホアプリで以下を確認してください：
            - 周波数: `921.0 MHz`
            - TX出力: `13 dBm以下`（XIAO nRF52840/XIAO ESP32S3+Wio-SX1262/Wio Tracker L1 Proは`10 dBm以下`、T1000-Eは`12 dBm以下`）
            - BW: `125 kHz` / SF: `10` / CR: `4/6`

            > ℹ️ Wio-SX1262搭載機（XIAO nRF52840/ESP32S3+Wio-SX1262、Wio Tracker L1 Pro）はモジュール単体で技適取得済み（工事設計認証201-250230、Seeed社書面回答2026/7/20）。ただし証明出力は10dBmのみのため、本ビルドは当該機種のTX出力のデフォルトを10dBmに設定しています。アンテナは付属の低利得アンテナ（FPCまたはSpring）を使用してください。試験報告書に記載されている8dBiのダイポール型アンテナは、10dBm設定ではEIRP超過のため使用不可です。技適の扱いには留保があります（下記「技適について」参照）。
            >
            > ℹ️ T1000-Eも工事設計認証を取得済み（217-252754、Seeed社書面回答2026/7/22）。証明出力は19mW（≈12.79dBm）が上限のため、本ビルドは当該機種のTX出力のデフォルトを12dBmに設定しています。技適の扱いには留保があります（下記「技適について」参照）。

            ### 技適について
            Wio-SX1262搭載機（XIAO nRF52840/ESP32S3+Wio-SX1262、Wio Tracker L1 Pro）とT1000-Eも含め、本ファームウェアでの運用が法的に問題ないと言い切れる状態ではありません（Seeed社は「最終的な適合性評価と責任は利用者側にあり、保証できない」と回答）。それ以外の機種は技適の対象外です。日本国内で電波を出す場合は、特例制度の届出をおすすめします。詳細は [README_JP.md](https://github.com/jirogit/MeshCore/blob/dev/README_JP.md) を参照してください。
          draft: true
          files: out_jp/*
